# ── DDoS Protection: Rate Limiting Zones ──
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# ── Main site: refsale.ru ──
# On the server 80/443 belong to the cooperative's nginx (/opt/1Kooperativniy).
# It terminates TLS for refsale.ru and proxies here over the shared "edge"
# Docker network, so this nginx speaks plain HTTP and publishes no ports.
server {
    listen 80;
    server_name refsale.ru www.refsale.ru;

    # Every request arrives from the proxy. Take the client address from its
    # X-Real-IP, or all visitors would share one rate-limit bucket. Only
    # containers can reach this nginx, so private ranges are safe to trust.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # ── DDoS: Connection limits ──
    limit_conn connlimit 50;
    client_max_body_size 50m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ── Security Headers (XSS, MITM, Clickjacking) ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP: default-src covers service-worker, worker-src and manifest-src added explicitly for stricter browsers
    # The built SPA has no inline scripts and no eval, so script-src stays
    # strict here. The admin panel is one big inline-script file and gets its
    # own looser policy in its location block below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; manifest-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://streams.rautemusik.fm https://*.rautemusik.fm https://*.radiohost.de; connect-src 'self' https://suggestions.dadata.ru; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ────────── Static / PWA ──────────

    # Hashed assets — immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hero pictures and the meerkat: not hashed, so a week rather than a year
    # (a replaced picture still reaches everyone within days).
    location ~ ^/(img|mascot)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PWA: service worker — НИКОГДА не кешируется, чтобы обновления прилетали сразу
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # PWA: workbox runtime (vite-plugin-pwa кладёт их в корень)
    location ~* ^/(workbox|sw|registerSW)[^/]*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # PWA: manifest с правильным MIME
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ────────── Backend proxies ──────────

    # Uploaded files
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API proxy — rate limited
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Auth endpoints — strict rate limit (brute force protection)
    location ~ ^/api/(login|register|admin/login|email/send-code) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Upload endpoint — strict rate limit
    location /api/admin/upload {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 50m;
    }



    # Admin panel. Previously 404 here, which only pushed admins to
    # http://<ip>:5000/admin.html — the API port, in plaintext, with no rate
    # limiting. That port is now loopback-only, so the panel is served here
    # over TLS instead. The admin login is the auth gate.
    #
    # To lock it to your own address, uncomment and set your IP:
    #     allow 203.0.113.10;
    #     deny all;
    location = /admin {
        limit_req zone=auth burst=5 nodelay;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # admin.html is inline-script heavy and pulls jsPDF + icon/webfonts
        # from cdnjs and Google Fonts, so those origins are allowed here only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdnjs.cloudflare.com; frame-ancestors 'none'" always;
        proxy_pass http://backend:5000/admin.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /admin.html {
        limit_req zone=auth burst=5 nodelay;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # admin.html is inline-script heavy and pulls jsPDF + icon/webfonts
        # from cdnjs and Google Fonts, so those origins are allowed here only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdnjs.cloudflare.com; frame-ancestors 'none'" always;
        proxy_pass http://backend:5000/admin.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
