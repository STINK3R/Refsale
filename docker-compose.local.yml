# Локальная разработка — без SSL, без Let's Encrypt
# Запуск: docker compose -f docker-compose.local.yml up --build
# Сайт: http://localhost:8090 | Админка: http://localhost:8090/admin | Adminer: http://localhost:8091
# Порты отличаются от кооператива, чтобы оба проекта можно было поднять одновременно.
# Локальные креды намеренно оставлены дефолтными — .env для запуска не нужен.

name: refsale

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: coop
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: coop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/migrate_all.sql:/docker-entrypoint-initdb.d/02-migrate_all.sql
      - ./db/migrate_v8.sql:/docker-entrypoint-initdb.d/03-migrate_v8.sql
      - ./db/migrate_v9.sql:/docker-entrypoint-initdb.d/04-migrate_v9.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d coop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coop:coop@db:5432/coop
      PORT: "5000"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      # Fixed throwaway value — local only, never used on the server.
      SERVER_SECRET: ${SERVER_SECRET:-local-dev-only-secret-do-not-use-in-production}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:8090}
      SITE_DOMAIN: ${SITE_DOMAIN:-http://localhost:8090}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:5001:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8090:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:latest
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette

volumes:
  pgdata:
  uploads:
