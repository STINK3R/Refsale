<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFD60A" />
  <title>Нет интернета — RefSale</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #FFFBEB; color: #111;
           display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #5C5647; line-height: 1.5; margin: 0 0 24px; }
    .btn { display: inline-block; text-decoration: none; color: #111; font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px;
             padding: 14px 28px; border-radius: 16px; border: 2px solid #111; background: #FFD60A; box-shadow: 0 4px 0 #111; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте сеть — как только она появится, RefSale откроется снова.</p>
    <a class="btn" href="/">Попробовать снова</a>
  </div>
</body>
</html>
